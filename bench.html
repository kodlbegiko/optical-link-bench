<!doctype html>
<html lang="zh-Hant">

<title>Optical Link Bench V0.20.8</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#182235;background:#f5f7fb}button{font:inherit}.page{height:100dvh;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:hidden}.top{flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;gap:8px}.top b{font-size:15px}.muted{color:#6e798b;font-size:10px}.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,300px) minmax(0,1fr);gap:6px;overflow:hidden}.grid.rx{grid-template-columns:minmax(0,1fr) minmax(330px,390px)}.card{background:#fff;border:1px solid #dbe2ec;border-radius:13px;overflow:hidden;min-width:0;min-height:0}.side{padding:7px;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}.hero{padding:6px 8px;border:1px solid #ccdcf8;border-radius:9px;background:#f3f7ff}.hero small{display:block;color:#68758a;font-size:8px}.hero b{font-size:18px;line-height:1.05}.btn{flex:0 0 34px;height:34px;border:1px solid #dbe2ec;border-radius:9px;background:#fff;font-weight:760;cursor:pointer;font-size:12px}.blue{background:#176cff;color:#fff;border-color:#176cff}.red{color:#b4233b;background:#fff1f2}.bar{flex:0 0 9px;height:9px;border-radius:99px;background:#e8edf4;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#176cff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px}.stat{padding:5px 6px;border:1px solid #e2e7ef;border-radius:8px;min-width:0}.stat small{display:block;color:#6d788b;font-size:7px;text-transform:uppercase}.stat b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage{display:grid;place-items:center;position:relative;padding:8px;background:#fff;min-height:0;overflow:hidden}.stage canvas{display:block;image-rendering:pixelated;width:auto!important;height:auto!important;max-width:calc(100% - 4px)!important;max-height:calc(100% - 4px)!important;aspect-ratio:1/1;object-fit:contain}.badge{position:absolute;top:7px;left:7px;background:#111d;color:#fff;padding:4px 6px;border-radius:7px;font:9px ui-monospace,monospace;z-index:2}.cam{background:#101215;padding:5px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}.view{flex:1;min-height:0;position:relative;background:#000;border-radius:9px;overflow:hidden}.view video{display:block;width:100%;height:100%;object-fit:contain}.roi{position:absolute;border:2px solid #38e48d;border-radius:7px;display:none;pointer-events:none}.cam .muted{color:#c4ccd7}.locked{color:#65f0a6!important;font-weight:800}.note{padding:5px 6px;border:1px solid #e1e7ef;border-radius:8px;background:#fafcff;font-size:9px;line-height:1.25;max-height:54px;overflow:auto}.modegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.modepill{padding:4px 5px;border:1px solid #dfe6ef;border-radius:7px;font-size:8px;background:#fff}.modepill.on{border-color:#176cff;background:#eef4ff;color:#1456cf;font-weight:800}.liberr{position:fixed;inset:0;background:#f5f7fb;z-index:99;display:grid;place-items:center;padding:24px}.liberr>div{max-width:680px;background:white;border:1px solid #dbe2ec;border-radius:16px;padding:20px}.report{position:fixed;inset:0;width:100vw;height:100dvh;background:#f5f7fb;padding:6px;z-index:9;display:none;flex-direction:column;gap:5px;overflow:hidden}.report.on{display:flex}.lead{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.lead>div{background:#fff;border:1px solid #dbe2ec;border-radius:10px;padding:6px}.lead small{display:block;color:#6d788b;font-size:8px}.lead b{font-size:16px}.tbl{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid #dbe2ec;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:5px;border-bottom:1px solid #e8edf4;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.ok{color:#08783e;font-weight:800}.warn{color:#a15c00;font-weight:800}@media(max-width:760px){.page{padding:4px;gap:4px}.top{flex-basis:32px}.top b{font-size:12px}.grid{grid-template-columns:1fr;gap:4px}.grid:not(.rx){grid-template-rows:minmax(225px,40%) minmax(0,1fr)}.grid.rx{grid-template-columns:1fr;grid-template-rows:minmax(185px,38%) minmax(0,1fr)}.side{padding:5px;gap:4px}.stats{grid-template-columns:repeat(4,1fr);gap:3px}.stat{padding:4px 3px}.stat small{font-size:6px}.stat b{font-size:9px}.btn{flex-basis:30px;height:30px;font-size:10px}.modegrid{grid-template-columns:repeat(3,1fr);gap:3px}.modepill{font-size:7px;padding:3px}.note{font-size:7.5px;max-height:38px}.cam{padding:4px}.cam>.muted{font-size:8px}.stage{padding:4px}.lead{grid-template-columns:repeat(2,1fr)}}@media(max-height:700px) and (min-width:761px){.page{padding:4px;gap:4px}.top{flex-basis:32px}.grid{grid-template-columns:minmax(240px,280px) minmax(0,1fr)}.grid.rx{grid-template-columns:minmax(0,1fr) minmax(310px,360px)}.side{padding:5px;gap:3px}.hero b{font-size:15px}.btn{flex-basis:30px;height:30px}.note{max-height:42px;font-size:8px}.stage{padding:5px}}
</style>
</head>
