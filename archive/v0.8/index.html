<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f7fb" />
<title>Optical Link Bench V0.8 · Auto Runner</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#dce3ec;--text:#172033;--muted:#68758a;--accent:#156cff;--good:#08783e;--warn:#a95d00;--bad:#c62d42;--dark:#0a0d12;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}button{font:inherit}.screen{height:100%;display:flex;flex-direction:column;padding:10px;gap:8px}.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand b{display:block;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.ghost,.primary,.danger{border-radius:12px;border:1px solid var(--line);height:40px;padding:0 14px;font-weight:700;background:#fff;color:var(--text)}.primary{background:var(--accent);color:#fff;border-color:transparent}.danger{background:#fff2f3;color:var(--bad);border-color:#f2c8ce}.main{flex:1;min-height:0;display:grid;gap:8px}.txmain{grid-template-columns:310px minmax(0,1fr)}.rxmain{grid-template-columns:minmax(0,1.3fr) 360px}.panel{min-height:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}.side{padding:12px;display:flex;flex-direction:column;gap:10px}.hero{border:1px solid #cde0ff;background:#f4f8ff;border-radius:15px;padding:12px}.hero small,.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}.hero b{display:block;font-size:26px;letter-spacing:-.03em;margin-top:4px}.status{font-size:12px;color:var(--muted);line-height:1.5}.progress{height:10px;border-radius:99px;background:#edf1f6;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfcfe}.stat b{display:block;font-size:14px;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .wide{grid-column:1/-1}.stage{background:#fff;display:grid;place-items:center;position:relative}.qrbox{width:100%;height:100%;display:grid;place-items:center}.qrbox canvas{max-width:95%;max-height:95%;width:auto!important;height:auto!important;image-rendering:pixelated}.badge{position:absolute;left:12px;top:12px;background:#111d;color:#fff;border-radius:9px;padding:7px 9px;font:11px ui-monospace,monospace}.camera{padding:7px;display:flex;flex-direction:column;gap:6px;background:#111}.preview{position:relative;flex:1;min-height:0;border-radius:13px;overflow:hidden;background:#000}.preview video{width:100%;height:100%;object-fit:contain}.preview:after{content:"";position:absolute;inset:7%;border:1px solid #ffffff55;border-radius:14px;pointer-events:none}.camhint{color:#cbd4df;font-size:10px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.summary{border-radius:13px;padding:10px;border:1px solid #d6e8dc;background:#f2fbf5}.summary b{display:block;color:var(--good);font-size:19px}.summary small{color:var(--muted)}.report{position:fixed;inset:0;background:#f5f7fb;z-index:20;display:none;flex-direction:column;padding:12px}.report.show{display:flex}.reporthead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.reportbody{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);background:#fff;border-radius:15px}.report table{border-collapse:collapse;width:100%;font-size:12px}.report th,.report td{border-bottom:1px solid #e8edf3;padding:8px;text-align:right;white-space:nowrap}.report th:first-child,.report td:first-child{text-align:left}.pass{color:var(--good);font-weight:700}.fail{color:var(--bad);font-weight:700}.tag{font:700 11px ui-monospace,monospace;color:var(--accent)}
@media(max-width:760px){.screen{padding:5px;gap:5px}.topbar{height:40px}.brand b{font-size:13px}.brand small{font-size:9px}.rxmain,.txmain{grid-template-columns:1fr}.rxmain{grid-template-rows:minmax(0,1fr) 225px}.txmain{grid-template-rows:190px minmax(0,1fr)}.side{padding:7px;gap:6px}.hero{padding:7px}.hero b{font-size:20px}.stats,.metrics{grid-template-columns:repeat(4,1fr);gap:3px}.stat{padding:5px}.stat b{font-size:10px}.stat small{font-size:7px}.summary{padding:6px}.summary b{font-size:14px}.status{font-size:9px}.camhint{font-size:8px}.ghost,.primary,.danger{height:34px;padding:0 9px;font-size:12px}.txmain .side .stats{display:none}.report{padding:6px}.report table{font-size:10px}.report th,.report td{padding:6px 5px}}
@media(max-height:560px) and (orientation:landscape){.rxmain{grid-template-columns:minmax(0,1.4fr) 330px;grid-template-rows:1fr}.txmain{grid-template-columns:300px minmax(0,1fr);grid-template-rows:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>

</head><body><div id="app"></div></body></html>
