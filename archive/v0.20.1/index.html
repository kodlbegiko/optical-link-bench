*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#182235;background:#f5f7fb}button{font:inherit}.page{height:100%;padding:8px;display:flex;flex-direction:column;gap:8px}.top{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top b{font-size:17px}.muted{color:#6e798b;font-size:11px}.grid{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr;gap:8px}.rx{grid-template-columns:1.2fr 430px}.card{background:#fff;border:1px solid #dbe2ec;border-radius:16px;overflow:hidden;min-height:0}.side{padding:11px;display:flex;flex-direction:column;gap:8px}.hero{padding:10px;border:1px solid #ccdcf8;border-radius:12px;background:#f3f7ff}.hero small{display:block;color:#68758a;font-size:9px}.hero b{font-size:22px}.btn{height:42px;border:1px solid #dbe2ec;border-radius:11px;background:#fff;font-weight:760;cursor:pointer}.blue{background:#176cff;color:#fff;border-color:#176cff}.red{color:#b4233b;background:#fff1f2}.bar{height:13px;border-radius:99px;background:#e8edf4;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#176cff;transition:width .12s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px}.stat{padding:7px;border:1px solid #e2e7ef;border-radius:9px;min-width:0}.stat small{display:block;color:#6d788b;font-size:8px;text-transform:uppercase;letter-spacing:.03em}.stat b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{display:grid;place-items:center;position:relative;padding:16px;background:#fff}.stage canvas{image-rendering:pixelated;max-width:100%;max-height:100%}.badge{position:absolute;top:10px;left:10px;background:#111d;color:#fff;padding:6px 8px;border-radius:8px;font:11px ui-monospace,monospace}.cam{background:#101215;padding:7px;display:flex;flex-direction:column;gap:6px}.view{flex:1;min-height:0;position:relative;background:#000;border-radius:12px;overflow
